name: Retire legacy GitHub Pages
on:
  workflow_dispatch:
    inputs:
      expected_pages_head:
        description: Current reviewed gh-pages commit (40 hex)
        required: true
        type: string
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish the reviewed retirement files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.expected_pages_head }}
        run: |
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pages" | jq -e '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/"' >/dev/null
          git fetch --no-tags --depth=1 origin refs/heads/gh-pages
          previous=$(git rev-parse FETCH_HEAD)
          test "$previous" = "$EXPECTED"
          tree=$(git rev-parse HEAD:.github/retired-pages)
          head="$previous"
          if test "$(git rev-parse "$previous^{tree}")" != "$tree"; then
            head=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$previous" -m 'Retire legacy Pages and migrate its service worker')
            git push origin "$head:refs/heads/gh-pages"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          echo "Previous gh-pages: $previous; requested retirement build: $head" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..60}; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            if test "$(jq -r .commit <<<"$result")" = "$head"; then
              case "$(jq -r .status <<<"$result")" in built) exit 0;; errored) exit 1;; esac
            fi
            sleep 5
          done
          exit 1
