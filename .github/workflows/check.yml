name: Check site
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: google-wizard-fixture
          MYSQL_ROOT_HOST: "%"
        ports:
          - "127.0.0.1:3306:3306"
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag cannot inject code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Authentication tests and lint need the pinned dependencies from package-lock.json.
      - run: npm ci --ignore-scripts
      - run: node --test test/*.test.mjs
      - name: Test owner authentication in Chrome with MySQL
        shell: bash
        env:
          MYSQL_TEST_CONFIG: ${{ runner.temp }}/google-wizard-mysql.json
          NODE_PATH: ${{ runner.temp }}/google-wizard/node_modules
        run: |
          umask 077
          printf '%s\n' '{"host":"127.0.0.1","port":3306,"user":"root","password":"google-wizard-fixture"}' > "$MYSQL_TEST_CONFIG"
          npm install --prefix "$RUNNER_TEMP/google-wizard" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.64.1
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          node --test test/local-auth-invitations.test.mjs test/local-auth.integration.test.mjs test/google-setup.integration.test.mjs test/accounts.integration.test.mjs test/mysql-kv.test.mjs
          node test/local-invitations.e2e.mjs | tee "$RUNNER_TEMP/owner-invitations.log"
          grep -q '^PASS real Chromium/MySQL:' "$RUNNER_TEMP/owner-invitations.log"
          node test/google-setup-browser.e2e.mjs | tee "$RUNNER_TEMP/google-wizard.log"
          grep -q '^PASS real Chromium/Node/MySQL Google wizard:' "$RUNNER_TEMP/google-wizard.log"
      - run: python3 -c "import ast; ast.parse(open('scripts/fast-cpanel-deploy.py').read())"
      - run: npx eslint .
      # Same settings as the deploy, so links are checked exactly as they will be published.
      - run: node scripts/build.mjs
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - run: node scripts/check-links.mjs
        env:
          SITE_BASE: /${{ github.event.repository.name }}
      # Orphan pages and broken links fail the check; warnings and suggestions are only reported (weekly report: link-audit.yml).
      - run: node scripts/audit-links.mjs --strict
        env:
          SITE_BASE: /${{ github.event.repository.name }}
