name: Check site
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag cannot inject code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
      # Lint needs the pinned dev tools from package-lock.json; the build itself has no dependencies.
      - run: npm ci --ignore-scripts
      - run: npx eslint .
      # Same settings as the deploy, so links are checked exactly as they will be published.
      - run: node scripts/build.mjs
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - run: node scripts/check-links.mjs
        env:
          SITE_BASE: /${{ github.event.repository.name }}
      # Orphan pages and broken links fail the check; warnings and suggestions are only reported (weekly report: link-audit.yml).
      - run: node scripts/audit-links.mjs --strict
        env:
          SITE_BASE: /${{ github.event.repository.name }}
