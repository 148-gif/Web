# Cloudflare Worker for the site editor's Google sign-in (see worker.mjs and README.md).
# Deployed by .github/workflows/cms-worker.yml whenever this folder changes on the publishing branch.
name = "heichal-cms"
main = "worker.mjs"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
# Fill in from Google Cloud (README.md, step 1). Not secret: Google shows it to every visitor of the sign-in button.
GOOGLE_CLIENT_ID = "919663714203-tli67jfhc255740ievn9she99pt019nv.apps.googleusercontent.com"
# SHA-256 of each owner's lower-case email (the repository is public, so the emails themselves are not written here).
# Add one with: printf %s "name@gmail.com" | sha256sum
OWNERS = "3433adb7521744e030794ba973a2faa70debbffe0c60abdd254c6cf9e11ea04b"
ALLOWED_ORIGIN = "https://148-gif.github.io"
REPO = "148-gif/Web"
BRANCH = "claude/greeting-2i183o"

# The editors the owners add from /admin/ (created in the site's Cloudflare account).
[[kv_namespaces]]
binding = "EDITORS"
id = "0457d5e9914b42e69d7f11ad77894d63"

# Drafts and the activity log (D1; the tables are created by the worker on first use).
[[d1_databases]]
binding = "DB"
database_name = "heichal-cms"
database_id = "da698e66-6615-4d83-98ef-9cb77ccd6531"

# Translates a Hebrew title into an English web address by meaning (Workers AI, pay per use with a daily free allowance).
[ai]
binding = "AI"

# Large media (video, big audio and files): R2, counted against its free 10GB. Served by this worker at /m/<file>
# (set MEDIA_PUBLIC_URL to the bucket's public r2.dev address, or a custom domain, to serve it directly instead).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "heichal-media"
